NG \"+pc+\" %\"}else if(p&&p.style.display!==\"none\"&&d.textContent!==\"LOADING 0 %\"){d.textContent=\"STARTING\"}},100)});</script>\n<script>(function(){[\"instantiate\",\"instantiateStreaming\"].forEach(function(k){var w=WebAssembly[k];if(!w)return;WebAssembly[k]=function(){var t=performance.now();return w.apply(WebAssembly,arguments).then(function(r){window.pr_wasm=[window.pr_wasm?window.pr_wasm[0]:t,performance.now(),k];return r})}})})();</script>"
